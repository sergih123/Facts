name: Android release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release.
# "Run workflow" (manual) builds a test APK you can download from the run page.
on:
  push:
    tags: ['v*', 'ci-test-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            # v1.2.3 -> 10203. Always grows with the version, so updates install over the old app.
            CODE=$(( BASH_REMATCH[1]*10000 + BASH_REMATCH[2]*100 + BASH_REMATCH[3] ))
            NAME="${TAG#v}"
            echo "FACTS_RELEASE=1" >> "$GITHUB_ENV"
          else
            CODE=1; NAME="test-${GITHUB_RUN_NUMBER}"
          fi
          echo "FACTS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "FACTS_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Building $NAME (versionCode $CODE)"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare Android project
        run: npm run android

      - name: Build signed APK
        env:
          FACTS_KEYSTORE_PASSWORD: ${{ secrets.FACTS_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -z "$FACTS_KEYSTORE_PASSWORD" ]; then
            # No key yet: build a debug APK only to check that everything compiles. Never released.
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "../Facts-TEST-ONLY-${FACTS_VERSION_NAME}.apk"
            echo "::error::Missing repository secret FACTS_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions). Built a test-only debug APK."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "Facts-${FACTS_VERSION_NAME}.apk"
          ls -la Facts-*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: ignore
          name: Facts-${{ env.FACTS_VERSION_NAME }}
          path: Facts-*.apk

      - name: Publish release
        if: env.FACTS_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: Facts-*.apk
          generate_release_notes: true
