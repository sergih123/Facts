name: Android release

# Every push to main builds the app.
# When the "version" in package.json has no GitHub release yet, the build is
# published as release vX.Y.Z with the signed APK attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./package.json').version")
          if [[ ! "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json version must look like 1.2.3 (got $NAME)"; exit 1
          fi
          # 1.2.3 -> 10203. Always grows with the version, so updates install over the old app.
          CODE=$(( BASH_REMATCH[1]*10000 + BASH_REMATCH[2]*100 + BASH_REMATCH[3] ))
          echo "FACTS_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "FACTS_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          if gh release view "v$NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$NAME already exists: build check only."
          else
            echo "FACTS_RELEASE=1" >> "$GITHUB_ENV"
            echo "New version v$NAME will be released."
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare Android project
        run: npm run android

      - name: Build APK
        env:
          FACTS_KEYSTORE_PASSWORD: ${{ secrets.FACTS_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -z "$FACTS_KEYSTORE_PASSWORD" ]; then
            # No key yet: build a debug APK only to check that everything compiles. Never released.
            ./gradlew assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "../Facts-TEST-ONLY-${FACTS_VERSION_NAME}.apk"
            echo "::error::Missing repository secret FACTS_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions). Built a test-only debug APK; nothing was released."
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "Facts-${FACTS_VERSION_NAME}.apk"
          ls -la Facts-*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Facts-${{ env.FACTS_VERSION_NAME }}
          path: Facts-*.apk
          if-no-files-found: ignore

      - name: Publish release
        if: env.FACTS_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FACTS_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Facts ${{ env.FACTS_VERSION_NAME }}
          files: Facts-*.apk
          generate_release_notes: true
